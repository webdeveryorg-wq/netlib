events { worker_connections 1024; }

http {
    limit_conn_zone $binary_remote_addr zone=conn_limit:1m;
    limit_req_zone $binary_remote_addr zone=spam_limit:1m rate=100r/s;
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https https;
    }
    server {
        listen 80;
        include /etc/nginx/locations.conf;
        location /health { proxy_pass http://netlib:8080/health; }
        location /ready { proxy_pass http://netlib:8080/ready; }
    }
}
